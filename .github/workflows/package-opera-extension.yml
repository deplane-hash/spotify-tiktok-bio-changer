name: Package Opera extension

on:
  workflow_dispatch:
  push:
    tags:
      - "opera-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          cd opera-extension
          zip -r ../biosync-opera-extension.zip . -x "*.DS_Store"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: biosync-opera-extension
          path: biosync-opera-extension.zip
          if-no-files-found: error

      - name: Attach zip to the tagged release
        if: startsWith(github.ref, 'refs/tags/opera-v')
        uses: softprops/action-gh-release@v2
        with:
          files: biosync-opera-extension.zip
